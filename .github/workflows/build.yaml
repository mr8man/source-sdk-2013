name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Generate projects
        working-directory: src
        shell: cmd
        continue-on-error: true
        run: creategameprojects.bat
      - name: List projects
        shell: cmd
        run: dir /s /b src\*.vcxproj
      - name: Build
        working-directory: src
        shell: cmd
        run: |
          set OPTS=/p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          msbuild mathlib\mathlib.vcxproj %OPTS% || exit /b 1
          msbuild tier1\tier1.vcxproj %OPTS% || exit /b 1
          msbuild raytrace\raytrace.vcxproj %OPTS% || exit /b 1
          msbuild vgui2\vgui_controls\vgui_controls.vcxproj %OPTS% || exit /b 1
          msbuild game\client\client_hl2.vcxproj %OPTS% || exit /b 1
          msbuild game\server\server_hl2.vcxproj %OPTS% || exit /b 1
      - name: List output
        if: always()
        shell: cmd
        run: dir /s /b *.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w_hl2-dlls
          path: |
            game/mod_hl2/bin/*.dll
            src/game/client/Release_mod_hl2/*.dll
            src/game/server/Release_mod_hl2/*.dll
          if-no-files-found: warn
